agent {
    # Must match the trust domain configured on the SPIRE server
    trust_domain = "demo.org"

    # SPIRE server address (Docker Compose service name)
    server_address = "spire-server"
    server_port    = 8081

    # Workload API socket — workloads connect here to request SVIDs
    # On production k8s: typically /run/spire/sockets/agent.sock (hostPath)
    # In Docker Compose: shared via named volume 'spire-agent-socket'
    socket_path = "/tmp/spire-agent/public/api.sock"

    # Agent data directory
    data_dir  = "/opt/spire/data/agent"
    log_level = "INFO"

    # Trust bundle: fetched from the server on first connect (insecure bootstrap).
    # insecure_bootstrap = true means the agent accepts the server's CA on first contact
    # (Trust On First Use — TOFU). For production, pre-distribute the bundle instead.
    insecure_bootstrap = true
}

plugins {

    # ── Node Attestor ─────────────────────────────────────────────────────
    # join_token: agent presents the token generated by 'spire-server token generate'
    # The token is passed via the SPIRE_JOIN_TOKEN env var in the entrypoint script.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # ── Workload Attestor: unix ────────────────────────────────────────────
    # This is the key piece for workload-level identity verification.
    #
    # When a workload calls the Workload API socket (/tmp/spire-agent/public/api.sock),
    # the SPIRE agent reads the calling process's PID via SO_PEERCRED (kernel mechanism).
    # It then reads process metadata from /proc/<PID>/:
    #
    #   unix:uid    → UID from /proc/<PID>/status (User: field)
    #   unix:user   → resolves UID to username via /etc/passwd
    #   unix:gid    → primary GID from /proc/<PID>/status
    #   unix:path   → symlink target of /proc/<PID>/exe (full binary path)
    #   unix:sha256 → SHA256 hash of the actual binary at that path
    #
    # The agent then checks: do the workload's attributes match any registered entry's selectors?
    # If yes → issue the configured SVID.
    # If no  → return empty (no SVID).
    #
    # sha256 is the strongest selector — it proves not just which binary, but WHICH EXACT
    # BUILD of that binary is running. A recompiled or modified binary has a different hash.
    #
    # Contrast with Azure Managed Identity:
    #   Managed identity proves WHICH AZURE RESOURCE (the Container App ARM object) exists.
    #   It does NOT check unix:uid, unix:path, or unix:sha256.
    #   Any process inside the container — including a compromised sidecar — can call
    #   IDENTITY_ENDPOINT and get the same token.
    WorkloadAttestor "unix" {
        plugin_data {
            # false: don't compare to the workload directory (use selector-based matching)
            discover_workload_dir = false
        }
    }

    # ── Key Manager ───────────────────────────────────────────────────────
    # memory: agent keys are ephemeral (regenerated on restart).
    # Production: use disk-based for faster restarts.
    KeyManager "memory" {
        plugin_data {}
    }

}
