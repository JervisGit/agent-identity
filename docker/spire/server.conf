server {
    # Network binding
    bind_address = "0.0.0.0"
    bind_port    = "8081"

    # Trust domain: the root of all SPIFFE URIs in this deployment.
    # All SVIDs issued will have the form: spiffe://demo.org/...
    # In production, use your org's domain (e.g., spiffe://acme.corp)
    trust_domain = "demo.org"

    # Data directory — SQLite datastore lives here
    data_dir = "/opt/spire/data/server"

    log_level = "INFO"

    # SVID lifetimes
    # Short TTLs are a key SPIFFE security property — SVIDs auto-rotate,
    # so even if a SVID is leaked, it expires quickly.
    ca_ttl              = "168h"   # Certificate Authority cert TTL (1 week)
    default_x509_svid_ttl = "1h"   # X.509 SVID (mTLS cert) TTL
    default_jwt_svid_ttl  = "5m"   # JWT-SVID TTL — very short for demo visibility
}

plugins {

    # ── Datastore ──────────────────────────────────────────────────────────
    # SQLite for local demo. Production: use Postgres plugin for HA.
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    # ── Node Attestor: join_token ──────────────────────────────────────────
    # The SPIRE agent presents a one-time token to authenticate to the server.
    # This is the simplest attestor — suitable for demos.
    #
    # In production, use cloud-specific attestors:
    #   - azure_msi:    Azure VM/AKS node presents its managed identity token
    #                   → server validates against Azure API
    #                   → ISSUE: only works for VM nodes, NOT ACA Consumption containers
    #   - aws_iid:      AWS EC2 instance identity document
    #   - k8s_psat:     Kubernetes Projected Service Account Token
    #
    # The join_token attestor's security model is TOFU (Trust On First Use):
    # each token can only be used once, then it's consumed and deleted.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # ── Key Manager ───────────────────────────────────────────────────────
    # disk: stores the signing key for SVID issuance on disk.
    # Production: use aws_kms, gcp_kms, or azure_key_vault for HSM-backed keys.
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }

}
